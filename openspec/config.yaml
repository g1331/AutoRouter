schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - 在设计阶段就需要完整地探索代码库与分析,确保能够规划出合理的任务
  design:
    - 必须包含讨论过程中产出的 UI 草图、框图、流程图等可视化设计稿（使用 ASCII art 或 Markdown 表格）
    - 涉及前端变更时，需包含关键场景的布局示意图和视觉层级说明
  tasks:
    - task.md设计:按照线性流程分解任务,每个任务都要有明确的输入和输出,确保阶段性的任务是可提交的,每个阶段的任务都要有明确的目标和验收标准
    - 执行流程:每完成一个任务就立即勾选任务完成,进行任务时需要自主规划提交节点并主动完成提交,每次提交都需要通过质量门禁

context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写。
  AutoRouter 是单一 Next.js 16 全栈 AI API 网关；管理 UI、API Routes 和 /api/proxy/v1/* 代理入口运行在同一应用中。
  使用 React 19、TypeScript、Drizzle ORM；生产默认 PostgreSQL，本地沙箱可用 SQLite。修改数据库结构时须同步 schema-pg.ts 与 schema-sqlite.ts。
  管理界面使用 next-intl，维护 zh-CN 与 en 两套文案；相关功能和代理请求语义以 AGENTS.md、CONTEXT.md 及现有 specs 为准。
  代码变更须补充对应测试，并按影响范围运行 Vitest、Playwright、lint、格式、类型或迁移一致性检查。
  提交遵循 Conventional Commits 和仓库 pre-commit 质量门禁；每个已完成的 OpenSpec 任务阶段应提交。
